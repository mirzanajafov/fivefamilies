x-node: &node
  image: fivefamilies-node
  build: .
  restart: unless-stopped
  cpus: 1
  mem_limit: 128m
  pids_limit: 128
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  entrypoint: ["supervisor", "-listen", ":3170", "--", "ffnode", "-cluster", "1=n1:3161,2=n2:3161,3=n3:3161,4=n4:3161,5=n5:3161", "-data", "/data", "-lease", "800ms", "-chaos", "-http", ":3171"]
  environment:
    FF_CHAOS_TOKEN: ${FF_CHAOS_TOKEN:-local-dev-chaos}

services:
  n1:
    <<: *node
    hostname: n1
    command: ["-id", "1"]
    ports: ["127.0.0.1:3151:3161"]
    volumes: ["n1:/data"]
    networks:
      default:
      registry:
        aliases: [fivefamilies-n1]
  n2:
    <<: *node
    hostname: n2
    command: ["-id", "2"]
    ports: ["127.0.0.1:3152:3161"]
    volumes: ["n2:/data"]
    networks:
      default:
      registry:
        aliases: [fivefamilies-n2]
  n3:
    <<: *node
    hostname: n3
    command: ["-id", "3"]
    ports: ["127.0.0.1:3153:3161"]
    volumes: ["n3:/data"]
    networks:
      default:
      registry:
        aliases: [fivefamilies-n3]
  n4:
    <<: *node
    hostname: n4
    command: ["-id", "4"]
    ports: ["127.0.0.1:3154:3161"]
    volumes: ["n4:/data"]
    networks:
      default:
      registry:
        aliases: [fivefamilies-n4]
  n5:
    <<: *node
    hostname: n5
    command: ["-id", "5"]
    ports: ["127.0.0.1:3155:3161"]
    volumes: ["n5:/data"]
    networks:
      default:
      registry:
        aliases: [fivefamilies-n5]
  controller:
    image: fivefamilies-node
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["controller"]
    command: ["-nodes", "n1:3161,n2:3161,n3:3161,n4:3161,n5:3161", "-supervisors", "http://n1:3170,http://n2:3170,http://n3:3170,http://n4:3170,http://n5:3170", "-listen", "0.0.0.0:3159"]
    environment:
      FF_CHAOS_TOKEN: ${FF_CHAOS_TOKEN:-local-dev-chaos}
      FF_ADMIN_TOKEN: ${FF_ADMIN_TOKEN:-local-dev-admin}
    ports: ["127.0.0.1:3159:3159"]
    depends_on: [n1, n2, n3, n4, n5]

networks:
  registry:
    name: fivefamilies-registry

volumes:
  n1:
  n2:
  n3:
  n4:
  n5:
