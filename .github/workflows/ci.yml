name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: sh scripts/protogen.sh && git diff --exit-code -- api
      - run: go vet ./...
      - run: go test -race $(go list ./... | grep -v /internal/sim)
      - run: go test ./internal/sim/
