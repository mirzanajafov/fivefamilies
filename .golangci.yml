version: "2"
linters:
  default: none
  enable:
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errorlint:
      errorf: false
      comparison: false
    gocritic:
      disabled-checks:
        - appendAssign
        - exitAfterDefer
    revive:
      enable-default-rules: true
      rules:
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T"
        - name: empty-block
          disabled: true
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: redefines-builtin-id
          disabled: true
        - name: unused-parameter
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
  exclusions:
    paths:
      - ^api/
formatters:
  enable:
    - gofmt
