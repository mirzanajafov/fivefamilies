version: "2"
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*google.golang.org/grpc.ClientConn).Close
        - (*github.com/mirzanajafov/fivefamilies/client.Client).Close
    revive:
      enable-default-rules: true
      rules:
        - name: context-as-argument
          arguments:
            - allow-types-before: "*testing.T,*testing.B,testing.TB"
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    paths:
      - ^api/
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
