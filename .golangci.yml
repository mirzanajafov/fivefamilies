version: "2"
linters:
  default: none
  enable:
    - errorlint
    - gocritic
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  settings:
    errorlint:
      errorf: false
      comparison: false
    gocritic:
      disabled-checks:
        - appendAssign
        - exitAfterDefer
    revive:
      rules:
        - name: blank-imports
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
  exclusions:
    paths:
      - api/
formatters:
  enable:
    - gofmt
