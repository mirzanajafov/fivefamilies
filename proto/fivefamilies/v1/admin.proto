syntax = "proto3";

package fivefamilies.v1;

option go_package = "github.com/mirzanajafov/fivefamilies/api/fivefamiliesv1;fivefamiliesv1";

message StatusRequest {}

message StatusResponse {
  uint64 id = 1;
  string state = 2;
  uint64 term = 3;
  uint64 leader = 4;
  uint64 commit = 5;
  uint64 applied = 6;
  uint64 first_index = 7;
  uint64 last_index = 8;
  uint64 snapshot_index = 9;
  uint64 state_hash = 10;
  uint64 hash_index = 11;
  repeated uint64 voters = 12;
  repeated uint64 learners = 13;
  uint64 transferee = 14;
  uint64 fsyncs = 15;
  uint64 wal_batches = 16;
  uint64 entries_written = 17;
  uint64 msgs_sent = 18;
  uint64 msgs_received = 19;
  uint64 reads = 20;
  uint64 writes = 21;
  uint64 elections = 22;
}

message ChaosRequest {
  string action = 1;
  uint64 duration_ms = 2;
}

message ChaosResponse {}

enum MemberChange {
  MEMBER_CHANGE_UNSPECIFIED = 0;
  MEMBER_CHANGE_ADD_LEARNER = 1;
  MEMBER_CHANGE_PROMOTE = 2;
  MEMBER_CHANGE_REMOVE = 3;
}

message ChangeMembersRequest {
  MemberChange change = 1;
  uint64 node = 2;
}

message ChangeMembersResponse {
  uint64 index = 1;
  repeated uint64 voters = 2;
  repeated uint64 learners = 3;
}

message TransferLeadershipRequest {
  uint64 to = 1;
}

message TransferLeadershipResponse {
  uint64 leader = 1;
  uint64 term = 2;
}

service Admin {
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc ChangeMembers(ChangeMembersRequest) returns (ChangeMembersResponse);
  rpc TransferLeadership(TransferLeadershipRequest) returns (TransferLeadershipResponse);
  rpc Chaos(ChaosRequest) returns (ChaosResponse);
}
