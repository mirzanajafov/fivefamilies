syntax = "proto3";

package fivefamilies.v1;

option go_package = "github.com/mirzanajafov/fivefamilies/api/fivefamiliesv1;fivefamiliesv1";

message Entry {
  uint64 term = 1;
  uint64 index = 2;
  uint32 type = 3;
  bytes data = 4;
}

message SnapshotMeta {
  uint64 index = 1;
  uint64 term = 2;
  repeated uint64 voters = 3;
  repeated uint64 learners = 4;
}

message RaftMessage {
  uint32 type = 1;
  uint64 from = 2;
  uint64 to = 3;
  uint64 term = 4;
  uint64 log_term = 5;
  uint64 index = 6;
  repeated Entry entries = 7;
  uint64 commit = 8;
  bool reject = 9;
  uint64 hint = 10;
  uint64 context = 11;
  SnapshotMeta snapshot = 12;
}

message Batch {
  repeated RaftMessage messages = 1;
}

message SnapshotChunk {
  RaftMessage message = 1;
  bytes data = 2;
}

message Ack {}

service Peer {
  rpc Send(stream Batch) returns (Ack);
  rpc InstallSnapshot(stream SnapshotChunk) returns (Ack);
}
